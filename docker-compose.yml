name: musica

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-musica}
      POSTGRES_USER: ${PGUSER:-musica}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # SQL files are available for manual execution; never auto-applied.
      - ./backend/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      MINIO_REGION_NAME: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-uploads}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-musica}
      PGUSER: ${PGUSER:-musica}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-67108864}
      HLS_WORKER_ENABLED: ${HLS_WORKER_ENABLED:-true}
      HLS_TIMEOUT_SECONDS: ${HLS_TIMEOUT_SECONDS:-900}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      HLS_TMP_DIR: /tmp/musica-hls
      SPOTIFY_WORKER_ENABLED: ${SPOTIFY_WORKER_ENABLED:-true}
      SPOTIFY_TIMEOUT_SECONDS: ${SPOTIFY_TIMEOUT_SECONDS:-900}
      SPOTIFY_TMP_DIR: /tmp/musica-spotify
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
